<style>
  .tile { animation: float 6s ease-in-out infinite alternate; }
  .tile:nth-child(2n) { animation-delay: -1.5s; } .tile:nth-child(3n) { animation-delay: -3s; } .tile:nth-child(4n) { animation-delay: -4.5s; }
  @keyframes float { from { transform: translateY(6px); } to { transform: translateY(-6px); } }
  .orb { animation: orb 14s ease-in-out infinite alternate; }
  @keyframes orb { from { transform: translate(-40px, 0); } to { transform: translate(40px, 20px); } }
  text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
